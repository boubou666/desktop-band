[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gopnik-band"
version = "0.1.0"
description = "An animated gopnik band that reacts to system audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "desktop-overlay @ https://github.com/boubou666/desktop-overlay/releases/download/v0.2.1/desktop_overlay-0.2.1-py3-none-any.whl",
    "numpy>=1.24",
    "onnxruntime>=1.23,<2",
    "pillow>=11,<13",
    "pynput>=1.8.2,<2",
    "pystray>=0.19.5,<0.20",
    "six>=1.17,<2",
    "soundcard>=0.4.3,<0.5",
    "yt-dlp[default]>=2025.1.15",
]

[project.urls]
Homepage = "https://github.com/boubou666/gopnik-band"
Repository = "https://github.com/boubou666/gopnik-band"
Changelog = "https://github.com/boubou666/gopnik-band/blob/main/CHANGELOG.md"

[project.optional-dependencies]
training = ["onnx>=1.19,<2", "pyyaml>=6,<7"]

[project.scripts]
gopnik-band = "desktop_band.__main__:main"
gopnik-band-annotator = "desktop_band.annotator:main"
desktop-band = "desktop_band.__main__:main"

[tool.setuptools.packages.find]
include = ["desktop_band*", "gopnik_band*"]

[tool.setuptools.package-data]
desktop_band = [
    "annotator_ui.html",
    "assets/packs/*/*.png",
    "assets/packs/*/*.json",
    "assets/decors/*.png",
    "models/*.onnx",
    "models/*.json",
]
